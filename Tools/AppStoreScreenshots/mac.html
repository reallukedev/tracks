<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracks Mac Screenshots</title>
<link rel="stylesheet" href="shared.css">
<script src="components.js"></script>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
// Mac: 2880 x 1800 per frame, ten frames, the way Apple shows its own Mac apps: the window
// full bleed at its own resolution, under a thin caption band in the iPhone set's style.
const W = 2880, H = 1800, N = 10;
const RAW2 = "../../build/raw2/mac/", RAW3 = "../../build/raw3/mac/";

const canvas = document.getElementById("canvas");
Object.assign(canvas.style, { width: px(W * N), height: px(H) });

const BAND = 216;
const CAPTION = { left: 120, width: W - 240, size: 54, inline: true };
// Window captures are 2880 x 1800: shown 1:1 under the band, losing only their foot.
const WINDOW = [0, 0, 2880, H - BAND, 2880, 1800];

const frames = [
  { idea: "Cover Flow is back.", detail: "Flip through your stations and mixes.", src: RAW2 + "listen-now.png" },
  { idea: "Radio that learns your taste.", detail: "Plus live stations and a mood for every moment.", src: RAW3 + "radio.png" },
  { idea: "Fills the room.", detail: "Now Playing opens out to the whole window.", src: RAW2 + "full-player.png" },
  { idea: "Music for every mood.", detail: "Each one picked from your own songs.", src: RAW3 + "mood-chill.png" },
  {
    idea: "Turn your Mac into a stage.", detail: "The visualizer moves to every beat.", src: RAW3 + "stage.png",
    // Full screen at 3456 x 2234 with the notch's black strip in its top 64 px. It's taller
    // than the frame, so keep rows 230 to 2131: the whole cover, the bars and the progress
    // line, dropping the strip and the "Next" line, scaled to the frame's width.
    crop: [0, 230, 3456, 1901, 3456, 2234],
  },
  { idea: "Your listening, at a glance.", detail: "Any week, month or year.", src: RAW2 + "summary.png" },
  { idea: "Charts, but yours.", detail: "Your top artists, songs and albums.", src: RAW3 + "top-artists.png" },
  { idea: "Every song you play, kept.", detail: "Even the ones on the radio.", src: RAW3 + "history.png" },
  { idea: "Just ask Siri.", detail: "“Play my station in Tracks.”", src: RAW2 + "listen-now.png" },
  { idea: "Yours, and only yours.", detail: "No account, no ads, no tracking.", type: true },
];

frames.forEach((spec, i) => {
  const f = frame(i, W, H);
  canvas.append(f);
  if (spec.type) {
    f.append(caption({ ...CAPTION, inline: false, top: H / 2 - 120, size: 100, idea: spec.idea, detail: spec.detail }));
    return;
  }
  f.append(caption({ ...CAPTION, top: (BAND - CAPTION.size * 1.2) / 2 + 4, idea: spec.idea, detail: spec.detail }));
  f.append(macShot({ src: spec.src, crop: spec.crop || WINDOW, left: 0, top: BAND, width: W, height: H - BAND }));
});

ready();
</script>
</body>
</html>
