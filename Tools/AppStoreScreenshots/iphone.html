<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracks iPhone Screenshots</title>
<link rel="stylesheet" href="shared.css">
<script src="components.js"></script>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
// iPhone 6.9": 1320 x 2868 per frame, nine frames side by side on one canvas, laid out the
// way Apple lays out its own App Store screenshots: a plain light field, a two-line caption
// at the top in the app's accent, and one iPhone, whole, in the lower four fifths.
const W = 1320, H = 2868, N = 9;
const RAW2 = "../../build/raw2/iphone/", RAW3 = "../../build/raw3/iphone/";

const canvas = document.getElementById("canvas");
Object.assign(canvas.style, { width: px(W * N), height: px(H) });

// One phone, the same size and place in every frame.
const S = 2.45;
const PH = phoneSize(S);
const PHONE_AT = { left: (W - PH.w) / 2, top: H - PH.h - 84, s: S };
const CAPTION = { left: 80, width: W - 160, top: 262, size: 62 };

const frames = [
  {
    idea: "Flip through your music.",
    detail: "Stations, mixes and moods in Cover Flow.",
    src: RAW2 + "play.png",
    build(f) {
      // The crate on the screen carries on past the phone: the same mix tiles on the same
      // centre line, turned the same way, spaced the way the app spaces them, with no
      // reflections. Measured on play.png: centre line at y 863, side tiles 597 px tall at
      // their outer edge, which sits 31 px past the screen edge; the app's Mac crate puts
      // each further tile about 210 px out and 5% smaller. The app fades its crate out over
      // the last 140 px at each screen edge; here it fades the same way at the frame's edges.
      const k = onPhone(PHONE_AT, 0, 0).k;
      const centre = onPhone(PHONE_AT, 0, 863).y;
      const crate = el("div", {
        position: "absolute", inset: "0",
        maskImage: `linear-gradient(90deg, transparent 0, #000 ${140 * k}px, #000 calc(100% - ${140 * k}px), transparent 100%)`,
        webkitMaskImage: `linear-gradient(90deg, transparent 0, #000 ${140 * k}px, #000 calc(100% - ${140 * k}px), transparent 100%)`,
      });
      const mixes = [
        ["Island Time", "Lanterns", "Coastal Drive", "Glasshouse"],
        ["Quiet Hours", "Satellite Hearts", "Evergreen", "Paper Moons"],
        ["Afterglow", "Golden Hour", "Monsoon", "Night Swim"],
        ["Daydream", "Static Bloom", "Northbound", "Honey Circuit"],
        ["Low Tide", "Heatwave", "Velvet Rain", "Driftwood"],
        ["Tides", "Weathervane", "Silver Coast", "Open Ocean"],
      ];
      // The first tile, which only overhangs the screen by 31 px, would show as a sliver against
      // the phone, so the continuation starts with the next one.
      [2, 1].forEach((step) => {
        const size = 597 * Math.pow(0.95, step) * k;
        const reach = (31 + step * 210) * k;
        for (const side of [-1, 1]) {
          const edge = side < 0 ? onPhone(PHONE_AT, 0, 0).x - reach : onPhone(PHONE_AT, 1206, 0).x + reach;
          const left = side < 0 ? edge : edge - size;
          crate.append(mixTile({ seeds: mixes[(side < 0 ? 0 : 3) + step], size, left, top: centre - size / 2, turn: side < 0 ? 6 : -6, perspective: 1800 }));
        }
      });
      f.append(crate);
    },
  },
  {
    idea: "Radio that learns your taste.",
    detail: "It starts wide, then finds your sound.",
    src: RAW3 + "radio-queue.png",
  },
  {
    idea: "Music for every mood.",
    detail: "Chill, Feel Good, Focus and more.",
    src: RAW3 + "mood-chill.png",
  },
  {
    idea: "Turn your phone into a stage.",
    detail: "The visualizer moves to every beat.",
    src: RAW3 + "stage-orb.png",
  },
  {
    idea: "Just ask Siri.",
    detail: "Play from Apple Music or your own music.",
    src: RAW2 + "nowplaying-dark.png",
  },
  {
    idea: "Every song you play, kept.",
    detail: "Even the ones on the radio.",
    src: RAW3 + "history-radio.png",
  },
  {
    idea: "Your day has a rhythm.",
    detail: "See the hours you listen most.",
    src: RAW2 + "rhythm.png",
  },
  {
    idea: "Ready when the party starts.",
    detail: "Dance mixes from your most-played songs.",
    src: RAW3 + "party.png",
  },
  {
    // The close: type only, in the same plain style.
    idea: "Yours, and only yours.",
    detail: "No account, no ads, no tracking.",
    type: true,
  },
];

frames.forEach((spec, i) => {
  const f = frame(i, W, H);
  canvas.append(f);
  if (spec.type) {
    f.append(caption({ ...CAPTION, top: H / 2 - 110, size: 84, idea: spec.idea, detail: spec.detail }));
    return;
  }
  f.append(caption({ ...CAPTION, idea: spec.idea, detail: spec.detail }));
  if (spec.build) spec.build(f);
  f.append(iphone({ src: spec.src, ...PHONE_AT }));
});

ready();
</script>
</body>
</html>
