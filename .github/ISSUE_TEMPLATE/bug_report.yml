name: Bug report
description: Something in Tracks doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem, please don't use this form: see [SECURITY.md](https://github.com/reallukedev/tracks/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, in a sentence or two.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Play a song on an Apple Music radio station
        2. Open History
        3. ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - Mac
        - Both
        - Widget or Control Center
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: iOS 27.0, macOS 27.0
    validations:
      required: true

  - type: input
    id: tracks-version
    attributes:
      label: Tracks version or commit
      description: The version you're running, or `git rev-parse --short HEAD` if you built it yourself.
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: What was playing
      description: Where the music came from, if it matters to the bug.
      multiple: true
      options:
        - A song, album or playlist played on demand
        - An Apple Music radio station
        - A song recovered from Recently Played
        - Nothing / not related to playback

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Anything that shows the problem. Please remove any Last.fm keys, secrets or session keys first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: If I built Tracks myself, the Mac build was signed (an unsigned Mac build runs with an empty, in-memory store).
