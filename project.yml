name: Tracks
options:
  bundleIdPrefix: dev.luke
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES

configFiles:
  Debug: Config/Tracks.xcconfig
  Release: Config/Tracks.xcconfig

# Declared here because XcodeGen doesn't create schemes, and the ones Xcode autocreates live
# in `xcuserdata`, which isn't committed and is wiped by `xcodegen generate`. Without these,
# build.sh fails with "does not contain a scheme named …".
schemes:
  Tracks (macOS):
    build:
      targets:
        Tracks (macOS): all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: TracksCore/TracksCoreTests
        - package: TracksCore/TracksMusicTests
    archive:
      config: Release
  Tracks (iOS):
    build:
      targets:
        Tracks (iOS): all
    run:
      config: Debug
    # The same package tests, run in the Simulator. TracksMusicTests has iOS-only suites.
    test:
      config: Debug
      targets:
        - package: TracksCore/TracksCoreTests
        - package: TracksCore/TracksMusicTests
    archive:
      config: Release
  # Runs the App Clip on its own. `_XCAppClipURL` in the environment opens it with a code.
  TracksClip (iOS):
    build:
      targets:
        TracksClip (iOS): all
    run:
      config: Debug
    archive:
      config: Release

packages:
  TracksCore:
    path: TracksCore

targets:
  Tracks (iOS):
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
    dependencies:
      - target: TracksWidgets (iOS)
      # SharePlay for passengers without Tracks, embedded as its App Clip.
      - target: TracksClip (iOS)
      - package: TracksCore
        product: TracksCore
      - package: TracksCore
        product: TracksMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID)
        PRODUCT_NAME: Tracks
        INFOPLIST_FILE: Apps/iOS/Resources/Info.plist
        # Tracks-CarPlay.entitlements, which adds CarPlay Audio to Tracks.entitlements. Set in
        # Config/Tracks.xcconfig, so a copy built without the grant can switch back.
        CODE_SIGN_ENTITLEMENTS: $(TRACKS_IOS_ENTITLEMENTS)
        # The app is main-actor by default. TracksCore isn't, so callers decide where work runs.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # iPhone only. Tracks ships for iPhone and the Mac; there's no iPad layout to stand
        # behind, so the App Store doesn't offer it there and it isn't listed as an iPad app.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # There's a native Mac app. Left on, Apple Silicon offers "My Mac (Designed for iPad)"
        # and macOS treats the iOS build as a second Tracks with the same bundle id.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  # Tracks’ App Clip: SharePlay's code opens it for a passenger without Tracks, to pick songs
  # for the host's Up Next. Only TracksCore, no MusicKit, so it stays small and needs no sign-in.
  TracksClip (iOS):
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Apps/Clip
      # Tracks’ own icon, which the App Clip card and the App Clips list show.
      - path: Apps/Shared/Resources/AppIcon.icon
    dependencies:
      - package: TracksCore
        product: TracksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID).Clip
        PRODUCT_NAME: TracksClip
        INFOPLIST_FILE: Apps/Clip/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/Clip/Resources/TracksClip.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        # Kept small, since an App Clip has to download in a moment.
        DEAD_CODE_STRIPPING: YES

  TracksWidgets (macOS):
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets/Shared
      - path: Widgets/macOS
      # Only the intent the widget's Play button uses and the file that picks its player.
      # The whole Intents folder would pull the capture stack into the extension.
      - path: Apps/Shared/Intents/PlayBackTodayIntent.swift
      - path: Apps/Shared/Playback/PlatformPlaybackService.swift
      # The widgets build the links the apps open; the apps' half is DeepLink+Routing.swift.
      - path: Apps/Shared/App/DeepLink.swift
    dependencies:
      - package: TracksCore
        product: TracksCore
      - package: TracksCore
        product: TracksMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID).Widgets
        PRODUCT_NAME: TracksWidgets
        INFOPLIST_FILE: Widgets/macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/macOS/Resources/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  TracksWidgets (iOS):
    type: app-extension
    platform: iOS
    sources:
      # Same widget code as the Mac; Widgets/Shared has nothing platform-specific.
      - path: Widgets/Shared
      - path: Widgets/iOS
      - path: Apps/Shared/Intents/PlayBackTodayIntent.swift
      - path: Apps/Shared/Playback/PlatformPlaybackService.swift
      # The widgets build the links the apps open; the apps' half is DeepLink+Routing.swift.
      - path: Apps/Shared/App/DeepLink.swift
    dependencies:
      - package: TracksCore
        product: TracksCore
      - package: TracksCore
        product: TracksMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID).Widgets
        PRODUCT_NAME: TracksWidgets
        INFOPLIST_FILE: Widgets/iOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/iOS/Resources/Widgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # Matches the app. An extension that still claims iPad fails App Store validation.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        # Matches the app. Left on, the extension alone would keep the Mac destination.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO

  # Reopens the Mac app when it stops without being quit. Embedded in the app, which starts
  # it at launch; see Watchdog/WatchdogMain.swift.
  TracksWatchdog:
    type: application
    platform: macOS
    sources:
      - path: Watchdog
    dependencies:
      - package: TracksCore
        product: TracksCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID).Watchdog
        PRODUCT_NAME: TracksWatchdog
        INFOPLIST_FILE: Watchdog/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watchdog/Resources/Watchdog.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  Tracks (macOS):
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - target: TracksWidgets (macOS)
      # Where helper apps live in a Mac app. Not registered as a login item: the app opens it.
      - target: TracksWatchdog
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Library/LoginItems
      - package: TracksCore
        product: TracksCore
      - package: TracksCore
        product: TracksMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TRACKS_BUNDLE_ID)
        PRODUCT_NAME: Tracks
        INFOPLIST_FILE: Apps/macOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/Resources/Tracks.entitlements
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
