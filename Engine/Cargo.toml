[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
tracks-model = { path = "crates/tracks-model" }
tracks-store = { path = "crates/tracks-store" }
tracks-lastfm = { path = "crates/tracks-lastfm" }

rusqlite = { version = "0.41", features = ["bundled", "functions"] }
rusqlite_migration = "2.7"
thiserror = "2"
rustc-hash = "2.1"
unicode-normalization = "0.1"
jiff = "0.2"
md-5 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uniffi = "0.32"

# Dev
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.12"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
single_match_else = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
unwrap_used = "deny"

[profile.release]
# Small, fast binary for phones: one codegen unit and thin LTO keep the dylib lean
# without the minutes-long link of fat LTO.
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "unwind"
debug = "line-tables-only"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
strip = "none"
